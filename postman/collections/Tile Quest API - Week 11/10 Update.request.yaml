$kind: http-request
url: "{{baseUrl}}/levels/{{setId}}"
method: PATCH
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
body:
  type: json
  content: '{ "difficulty": "Hard" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 10000
