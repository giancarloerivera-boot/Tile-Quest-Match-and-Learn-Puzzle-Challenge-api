$kind: http-request
url: "{{baseUrl}}/levels"
method: POST
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
body:
  type: json
  content: '{ "level_number": {{levelNumber}}, "difficulty": "Easy" }'
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("levelNumber", Math.floor(Math.random() * 900) + 100);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("status is 201", function () {
        pm.response.to.have.status(201);
      });
      pm.collectionVariables.set("setId", pm.response.json().id);
    language: text/javascript
order: 1000
