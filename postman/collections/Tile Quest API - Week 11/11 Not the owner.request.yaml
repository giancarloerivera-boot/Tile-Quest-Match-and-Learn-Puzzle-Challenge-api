$kind: http-request
url: "{{baseUrl}}/levels/{{setId}}"
method: PATCH
headers:
  X-Demo-User: "{{otherHost}}"
  Content-Type: application/json
body:
  type: json
  content: '{ "difficulty": "Medium" }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 403", function () {
        pm.response.to.have.status(403);
      });
    language: text/javascript
order: 11000
