$kind: http-request
url: "{{baseUrl}}/levels"
method: POST
headers:
  X-Demo-User: "{{host}}"
  Content-Type: application/json
body:
  type: json
  content: '{ "level_number": 0, "difficulty": 5 }'
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 400", function () {
        pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
